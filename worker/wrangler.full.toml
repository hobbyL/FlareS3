name = "flares3-spa"
main = "src/index.ts"
compatibility_date = "2026-06-11"
compatibility_flags = ["nodejs_compat"]

[placement]
mode = "smart"

[observability]
enabled = true

[assets]
directory = "../frontend/dist"
binding = "ASSETS"

[vars]
MAX_FILE_SIZE = "5368709120"
TOTAL_STORAGE = "10737418240"
# 限流阈值均为可选，缺省时使用 src/config/rateLimit.ts 中的默认值：
# 客户端 IP 仅信任 Cloudflare 注入的 CF-Connecting-IP（getClientIp 不回退
# X-Forwarded-For，其首值可被客户端伪造）；本项目仅部署于 Cloudflare 边缘。
# 限流 key 维度：登录按 IP + 用户名（SHA-256 摘要）；分享码按 IP + 分享码；
# 公开入口按 IP 全局桶 + 入口类别桶（s/t/f/dl）。
# RATE_LIMIT_WINDOW_MS = "60000"                    # 登录窗口，默认 60000
# RATE_LIMIT_MAX = "300"                            # 登录窗口内最大请求数，默认 300
# RATE_LIMIT_MAX_FAILED_ATTEMPTS = "10"             # 登录失败封禁阈值，默认 10
# RATE_LIMIT_BLOCK_DURATION_MS = "300000"           # 登录封禁时长，默认 300000
# SHARE_RATE_LIMIT_MAX_FAILED_ATTEMPTS = "5"        # 分享码密码错误封禁阈值，默认 5
# SHARE_RATE_LIMIT_BLOCK_DURATION_MS = "600000"     # 分享码封禁时长，默认 600000
# PUBLIC_RATE_LIMIT_WINDOW_MS = "60000"             # 公开入口窗口，默认 60000
# PUBLIC_RATE_LIMIT_MAX = "120"                     # 公开入口窗口内最大请求数，默认 120
# 上游存储 fetch 超时（可选）：R2 / WebDAV / Koofr 上游请求的超时毫秒数，
# 以及只读操作（GET/HEAD/PROPFIND）超时后的重试次数；写操作一律不重试。
# UPSTREAM_FETCH_TIMEOUT_MS = "30000"               # 上游 fetch 超时，默认 30000
# UPSTREAM_FETCH_READONLY_RETRIES = "1"             # 只读超时重试次数，默认 1
# 访问日志开关（可选）：设为 "1" 时额外输出 4xx/2xx 结构化请求日志，缺省仅记录 5xx。
# LOG_ACCESS = "1"
# 调试响应头开关（可选）：设为 "1" 时在响应中追加 Server-Timing 与 X-Flares3-* 请求耗时/isolate 诊断头。
# FLARES3_DEBUG_HEADERS = "1"

[[d1_databases]]
binding = "DB"
database_name = "flares3-db"
database_id = "REPLACE_WITH_D1_ID"
migrations_dir = "migrations"

[triggers]
crons = ["0 * * * *"]
